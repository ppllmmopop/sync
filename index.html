<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sync Player</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body {
            background-color: #080b0e;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 8px;
            overflow-x: hidden;
        }

        .player-card {
            width: 100%;
            max-width: 360px;
            height: 670px;
            background: linear-gradient(165deg, #13191e 0%, #0d1216 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 12px 16px 14px 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        .top-bar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 6px;
            transition: opacity 0.3s ease;
        }

        .top-handle {
            width: 32px;
            height: 3px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            margin: 0 auto;
        }

        .btn-icon-svg {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s, transform 0.1s;
        }
        .btn-icon-svg:hover { color: #f8fafc; }
        .btn-icon-svg:active { transform: scale(0.92); }
        .btn-icon-svg svg { width: 18px; height: 18px; fill: currentColor; }

        .media-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .art-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            overflow: hidden;
            background: #070a0d;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .art-wrapper img, .art-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .placeholder-text {
            color: #64748b;
            font-size: 12px;
            text-align: center;
            padding: 16px;
        }

        .overlay-subtitle {
            position: absolute;
            left: 12px;
            right: 12px;
            text-align: center;
            background: rgba(13, 18, 22, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.4;
            color: #f8fafc;
            white-space: pre-wrap;
            pointer-events: none;
            z-index: 20;
            backdrop-filter: blur(8px);
            top: 50%;
            transform: translateY(-50%);
            transition: opacity 0.3s ease;
        }

        .art-wrapper.has-image .overlay-subtitle {
            top: auto;
            bottom: 12px;
            transform: none;
        }

        .track-info-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            margin-bottom: 6px;
        }

        .track-meta {
            display: flex;
            flex-direction: column;
            max-width: 60%;
            overflow: hidden;
        }

        .track-title {
            font-size: 14px;
            font-weight: 600;
            color: #f1f5f9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 11px;
            color: #64748b;
            margin-top: 2px;
        }

        .img-nav-btns {
            display: flex;
            gap: 6px;
        }

        .btn-img-shift {
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #94a3b8;
            cursor: pointer;
            font-size: 10px;
            font-weight: 500;
            transition: background 0.2s;
        }
        .btn-img-shift:hover { background: rgba(255, 255, 255, 0.08); color: #f8fafc; }

        .lyrics-scroll-view {
            display: none;
            flex: 1;
            width: 100%;
            margin: 8px 0;
            overflow-y: auto;
            padding-right: 4px;
            scroll-behavior: smooth;
        }

        .player-card.lyrics-mode .media-container { flex-direction: row; gap: 8px; }
        .player-card.lyrics-mode .art-wrapper { width: 42px; height: 42px; border-radius: 6px; flex-shrink: 0; }
        .player-card.lyrics-mode .overlay-subtitle { display: none !important; }
        .player-card.lyrics-mode .track-info-bar { margin: 0; flex-grow: 1; }
        .player-card.lyrics-mode .lyrics-scroll-view { display: flex; flex-direction: column; gap: 10px; }

        .lyric-line {
            font-size: 14px;
            font-weight: 500;
            color: #475569;
            line-height: 1.4;
            cursor: pointer;
            transition: color 0.2s;
            white-space: pre-wrap;
        }
        .lyric-line.active { color: #34d399; font-weight: 600; }

        .controls-overlay-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 8px;
            padding-bottom: 4px;
            transition: opacity 0.3s ease;
        }

        .progress-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .seek-slider {
            width: 100%;
            height: 4px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            outline: none;
        }

        .seek-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #34d399;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(52, 211, 153, 0.4);
        }

        .time-labels {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #64748b;
        }

        .controls-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin: 4px 0;
        }

        .btn-skip-text {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #94a3b8;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 8px;
        }

        .btn-play-main {
            background: #10b981;
            border: none;
            color: #04120e;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.25);
            transition: transform 0.1s, background 0.2s;
        }
        .btn-play-main:hover { background: #34d399; }
        .btn-play-main:active { transform: scale(0.95); }

        .bottom-tray {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .font-size-ctrls {
            display: flex;
            gap: 4px;
        }
        .btn-font-step {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #94a3b8;
            font-size: 10px;
            padding: 3px 7px;
            border-radius: 5px;
            cursor: pointer;
        }

        .player-card.is-fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            max-width: 100vw !important;
            height: 100vh !important;
            max-height: 100vh !important;
            border-radius: 0 !important;
            border: none !important;
            background: #000000 !important;
            z-index: 9999 !important;
            padding: 0 !important;
            margin: 0 !important;
        }

        .player-card.is-fullscreen .top-bar-header {
            position: absolute;
            top: 16px;
            right: 16px;
            width: auto;
            z-index: 10001;
        }
        .player-card.is-fullscreen .top-handle { display: none; }

        .player-card.is-fullscreen .media-container {
            position: absolute;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
        }

        .player-card.is-fullscreen .art-wrapper {
            width: 100vw !important;
            height: 100vh !important;
            border: none !important;
            border-radius: 0 !important;
            background: #000000 !important;
        }

        .player-card.is-fullscreen .track-info-bar { display: none; }
        .player-card.is-fullscreen .lyrics-scroll-view { display: none !important; }

        .player-card.is-fullscreen .overlay-subtitle {
            z-index: 10001;
            bottom: 180px;
            background: rgba(0,0,0,0.85);
            border: 1px solid rgba(255,255,255,0.2);
            left: 20px; right: 20px;
        }

        .player-card.is-fullscreen .controls-overlay-container {
            position: absolute;
            bottom: 0; left: 0;
            width: 100vw;
            z-index: 10000;
            background: linear-gradient(to top, rgba(0,0,0,0.95), rgba(0,0,0,0.2) 70%, transparent);
            padding: 20px 24px 32px 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .player-card.is-fullscreen #btnReset { display: none !important; }

        .player-card.is-fullscreen.hide-ui .top-bar-header,
        .player-card.is-fullscreen.hide-ui .controls-overlay-container {
            opacity: 0;
            pointer-events: none;
        }

        .modal-backdrop {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            justify-content: flex-end;
            z-index: 20000;
            backdrop-filter: blur(4px);
        }
        .modal-backdrop.show { display: flex; }

        .modal-content {
            background: #13191e;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px;
            max-height: 85%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; color: #f1f5f9; }
        .btn-file-label { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); padding: 9px 12px; border-radius: 8px; font-size: 11px; display: flex; justify-content: space-between; color: #34d399; cursor: pointer; align-items: center; }
        .btn-file-label input { display: none; }
        .file-status { color: #64748b; font-size: 10px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .btn-add-item { background: #10b981; color: #04120e; border: none; padding: 10px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
        
        .list-section-title { font-size: 11px; font-weight: 600; color: #94a3b8; margin-top: 4px; }
        .items-list { list-style: none; display: flex; flex-direction: column; gap: 4px; max-height: 120px; overflow-y: auto; }
        .item-row { background: rgba(255, 255, 255, 0.03); padding: 6px 10px; border-radius: 6px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; color: #cbd5e1; }
        .item-row.active { border: 1px solid #34d399; color: #34d399; background: rgba(52, 211, 153, 0.05); cursor: pointer; }
        .btn-del-mini { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; border-radius: 4px; padding: 2px 6px; font-size: 9px; cursor: pointer; }
        .btn-del-mini:hover { background: rgba(239, 68, 68, 0.3); }
    </style>
</head>
<body>

<div class="player-card" id="playerCard">
    <div class="top-bar-header">
        <button class="btn-icon-svg" id="btnOpenSettings" title="설정">
            <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </button>
        <div class="top-handle"></div>
        <button class="btn-icon-svg" id="btnFullScreen" title="전체화면">
            <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
    </div>

    <div class="media-container">
        <div class="art-wrapper" id="artWrapper">
            <span class="placeholder-text" id="placeholder">상단 ⚙️ 설정 버튼을 눌러 미디어를 추가해 주세요</span>
            <video id="lyricsVideo" playsinline style="display: none;"></video>
            <img id="lyricsImage" style="display: none;" alt="Cover Art">
            <div class="overlay-subtitle" id="overlaySub" style="display: none;"></div>
        </div>

        <div class="track-info-bar">
            <div class="track-meta">
                <div class="track-title" id="trackTitle">재생 중인 파일 없음</div>
                <div class="track-artist" id="trackArtist">Sync Player</div>
            </div>
            <div class="img-nav-btns">
                <button class="btn-img-shift" id="btnPrevImg">IMG ◄</button>
                <button class="btn-img-shift" id="btnNextImg">► IMG</button>
            </div>
        </div>
    </div>

    <div class="lyrics-scroll-view" id="lyricsScrollView">
        <div class="lyric-line">자막 파일(.vtt, .srt)을 등록하면 목록이 표시됩니다.</div>
    </div>

    <div class="controls-overlay-container">
        <div class="progress-section">
            <input type="range" class="seek-slider" id="seekSlider" value="0" min="0" max="100" step="0.1">
            <div class="time-labels">
                <span id="currentTimeStr">0:00</span>
                <span id="durationStr">-0:00</span>
            </div>
        </div>

        <div class="controls-row">
            <button class="btn-skip-text" id="btnRewind">-5s</button>
            <button class="btn-icon-svg" id="btnPrevTrack" title="이전 트랙">
                <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <button class="btn-play-main" id="btnPlay">▶</button>
            <button class="btn-icon-svg" id="btnNextTrack" title="다음 트랙">
                <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
            <button class="btn-skip-text" id="btnForward">+5s</button>
        </div>

        <div class="bottom-tray">
            <button class="btn-icon-svg" id="btnReset" title="리셋">
                <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
            </button>
            
            <div class="font-size-ctrls">
                <button class="btn-font-step" id="btnFontDown">A-</button>
                <button class="btn-font-step" id="btnFontUp">A+</button>
            </div>

            <button class="btn-icon-svg" id="btnToggleLyrics" title="자막 보기/숨기기">
                <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zM4 12h4v2H4v-2zm16 6H4v-2h16v2zm0-4h-8v-2h8v2z"/></svg>
            </button>
            <button class="btn-icon-svg" id="btnOpenPlaylist" title="플레이리스트 관리">
                <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
            </button>
        </div>
    </div>

    <!-- 설정 및 관리 모달 -->
    <div class="modal-backdrop" id="modalBackdrop">
        <div class="modal-content">
            <div class="modal-header">
                <span>⚙️ 설정 및 미디어 관리</span>
                <button class="btn-icon-svg" id="btnCloseModal">✕</button>
            </div>

            <label class="btn-file-label">
                🎬 배경 영상 / 🖼️ 이미지 추가 (누적 선택 가능)
                <span class="file-status" id="statusMedia">선택 안 됨</span>
                <input type="file" id="inputMedia" accept="image/*,video/*" multiple>
            </label>
            <ul class="items-list" id="bgListUI">
                <li style="font-size: 10px; color: #64748b; text-align: center; padding: 4px;">등록된 배경 미디어가 없습니다</li>
            </ul>

            <label class="btn-file-label" style="margin-top: 4px;">
                🎵 음악 / 영상 파일 선택
                <span class="file-status" id="statusAudio">선택 안 됨</span>
                <input type="file" id="inputAudio" accept=".mp3,.wav,.m4a,.aac,.flac,.mp4,.mov,audio/*,video/*">
            </label>

            <label class="btn-file-label">
                📝 자막 파일 선택 (.vtt, .srt)
                <span class="file-status" id="statusVtt">선택 안 됨</span>
                <input type="file" id="inputVtt" accept=".vtt,.srt,text/plain,*/*">
            </label>

            <button class="btn-add-item" id="btnAddSet">➕ 플레이리스트에 트랙 추가</button>

            <div class="list-section-title">플레이리스트 목록</div>
            <ul class="items-list" id="playlistUI">
                <li style="font-size: 10px; color: #64748b; text-align: center; padding: 4px;">등록된 트랙이 없습니다</li>
            </ul>
        </div>
    </div>
</div>

<audio id="mainAudio" style="display: none;"></audio>

<script>
    const playerCard = document.getElementById('playerCard');
    const artWrapper = document.getElementById('artWrapper');
    const audio = document.getElementById('mainAudio');
    const video = document.getElementById('lyricsVideo');
    const image = document.getElementById('lyricsImage');
    const placeholder = document.getElementById('placeholder');
    const overlaySub = document.getElementById('overlaySub');
    const trackTitle = document.getElementById('trackTitle');
    const lyricsScrollView = document.getElementById('lyricsScrollView');
    const seekSlider = document.getElementById('seekSlider');
    const currentTimeStr = document.getElementById('currentTimeStr');
    const durationStr = document.getElementById('durationStr');
    const btnPlay = document.getElementById('btnPlay');

    let backgroundMediaList = []; // { name, url, type }
    let currentImageIndex = 0;
    let playlist = []; // { name, mediaSrc, isVideoTrack, vttText, vttName }
    let currentIndex = -1;
    let backgroundType = null; // 'image' or 'video'
    let subtitles = [];
    let activeSubIndex = -1;
    let suppressOverlaySub = false;
    let currentFontSize = 14;

    let tempMediaFile = null, tempVttText = null, tempVttName = '';
    let hideUiTimer = null;

    // 로컬 저장소(localStorage) 데이터 불러오기
    function loadFromStorage() {
        try {
            const savedPlaylist = localStorage.getItem('sync_playlist');
            const savedBg = localStorage.getItem('sync_backgrounds');
            if (savedPlaylist) playlist = JSON.parse(savedPlaylist);
            if (savedBg) {
                backgroundMediaList = JSON.parse(savedBg);
                if (backgroundMediaList.length > 0) {
                    backgroundType = backgroundMediaList[0].type;
                    updateImageDisplay();
                }
            }
            renderPlaylist();
            renderBgList();
            if (playlist.length > 0) loadTrack(0, false);
        } catch (e) {
            console.log('Load storage error:', e);
        }
    }

    // 로컬 저장소에 저장하기
    function saveToStorage() {
        try {
            localStorage.setItem('sync_playlist', JSON.stringify(playlist));
            localStorage.setItem('sync_backgrounds', JSON.stringify(backgroundMediaList));
        } catch (e) {
            console.log('Save storage error (storage might be full due to large files):', e);
        }
    }

    function resetHideUiTimer() {
        if (!playerCard.classList.contains('is-fullscreen')) return;
        playerCard.classList.remove('hide-ui');
        if (hideUiTimer) clearTimeout(hideUiTimer);
        hideUiTimer = setTimeout(() => {
            if (playerCard.classList.contains('is-fullscreen')) {
                playerCard.classList.add('hide-ui');
            }
        }, 3000);
    }

    document.getElementById('btnFullScreen').addEventListener('click', () => {
        playerCard.classList.toggle('is-fullscreen');
        if (playerCard.classList.contains('is-fullscreen')) {
            resetHideUiTimer();
        } else {
            playerCard.classList.remove('hide-ui');
            if (hideUiTimer) clearTimeout(hideUiTimer);
        }
    });

    ['mousemove', 'touchstart', 'click', 'keydown'].forEach(evt => {
        playerCard.addEventListener(evt, () => {
            if (playerCard.classList.contains('is-fullscreen')) resetHideUiTimer();
        });
    });

    function formatTime(sec) {
        if (isNaN(sec) || !isFinite(sec)) return "0:00";
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function getActiveMedia() {
        if (currentIndex >= 0 && playlist[currentIndex] && playlist[currentIndex].isVideoTrack) {
            return video;
        }
        return audio;
    }

    document.getElementById('btnFontUp').addEventListener('click', () => {
        currentFontSize = Math.min(28, currentFontSize + 2);
        overlaySub.style.fontSize = `${currentFontSize}px`;
    });
    document.getElementById('btnFontDown').addEventListener('click', () => {
        currentFontSize = Math.max(10, currentFontSize - 2);
        overlaySub.style.fontSize = `${currentFontSize}px`;
    });

    document.getElementById('btnToggleLyrics').addEventListener('click', function() {
        playerCard.classList.toggle('lyrics-mode');
    });

    const modalBackdrop = document.getElementById('modalBackdrop');
    const openSettingsBtn = document.getElementById('btnOpenSettings');
    const openPlaylistBtn = document.getElementById('btnOpenPlaylist');
    
    [openSettingsBtn, openPlaylistBtn].forEach(btn => {
        btn.addEventListener('click', () => modalBackdrop.classList.add('show'));
    });
    document.getElementById('btnCloseModal').addEventListener('click', () => modalBackdrop.classList.remove('show'));

    // 배경 미디어 누적 추가 (초기화 없음)
    document.getElementById('inputMedia').addEventListener('change', (e) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        placeholder.style.display = 'none';
        
        files.forEach(file => {
            const isVid = file.type.startsWith('video/') || /\.(mp4|mov|webm)$/i.test(file.name);
            const url = URL.createObjectURL(file);
            backgroundMediaList.push({
                name: file.name,
                url: url,
                type: isVid ? 'video' : 'image'
            });
        });

        if (!backgroundType && backgroundMediaList.length > 0) {
            backgroundType = backgroundMediaList[0].type;
        }

        updateImageDisplay();
        renderBgList();
        saveToStorage();
        document.getElementById('statusMedia').innerText = `${backgroundMediaList.length개}개 미디어`;
        e.target.value = ''; // 재선택 가능하도록 초기화
    });

    function renderBgList() {
        const bgUI = document.getElementById('bgListUI');
        bgUI.innerHTML = '';
        if (backgroundMediaList.length === 0) {
            bgUI.innerHTML = '<li style="font-size: 10px; color: #64748b; text-align: center; padding: 4px;">등록된 배경 미디어가 없습니다</li>';
            return;
        }
        backgroundMediaList.forEach((item, idx) => {
            const li = document.createElement('li');
            li.className = 'item-row';
            const badge = item.type === 'video' ? '📹' : '🖼️';
            li.innerHTML = `
                <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width: 75%;">${badge} ${item.name}</span>
                <button class="btn-del-mini" data-idx="${idx}">삭제</button>
            `;
            li.querySelector('.btn-del-mini').addEventListener('click', (ev) => {
                ev.stopPropagation();
                backgroundMediaList.splice(idx, 1);
                if (currentImageIndex >= backgroundMediaList.length) {
                    currentImageIndex = Math.max(0, backgroundMediaList.length - 1);
                }
                renderBgList();
                updateImageDisplay();
                saveToStorage();
            });
            bgUI.appendChild(li);
        });
    }

    document.getElementById('inputAudio').addEventListener('change', (e) => {
        if (e.target.files && e.target.files.length > 0) {
            tempMediaFile = e.target.files[0];
            document.getElementById('statusAudio').innerText = tempMediaFile.name;
        }
    });

    document.getElementById('inputVtt').addEventListener('change', (e) => {
        if (e.target.files && e.target.files.length > 0) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (evt) => {
                tempVttText = evt.target.result;
                tempVttName = file.name;
                document.getElementById('statusVtt').innerText = file.name;
            };
            reader.readAsText(file);
        }
    });

    document.getElementById('btnAddSet').addEventListener('click', () => {
        if (!tempMediaFile) {
            alert('음원(MP3 등) 또는 영상(MP4 등) 파일을 선택해 주세요.');
            return;
        }

        const fileName = tempMediaFile.name.toLowerCase();
        const isVideoTrack = tempMediaFile.type.startsWith('video/') || /\.(mp4|mov|mkv|webm)$/i.test(fileName);

        playlist.push({
            name: tempMediaFile.name,
            mediaSrc: URL.createObjectURL(tempMediaFile),
            isVideoTrack: isVideoTrack,
            vttText: tempVttText,
            vttName: tempVttName
        });

        tempMediaFile = null; tempVttText = null; tempVttName = '';
        document.getElementById('inputAudio').value = '';
        document.getElementById('inputVtt').value = '';
        document.getElementById('statusAudio').innerText = '선택 안 됨';
        document.getElementById('statusVtt').innerText = '선택 안 됨';

        renderPlaylist();
        saveToStorage();
        if (currentIndex === -1) loadTrack(0);
    });

    function renderPlaylist() {
        const ui = document.getElementById('playlistUI');
        ui.innerHTML = '';
        if (playlist.length === 0) {
            ui.innerHTML = '<li style="font-size: 10px; color: #64748b; text-align: center; padding: 4px;">등록된 트랙이 없습니다</li>';
            return;
        }
        playlist.forEach((item, idx) => {
            const li = document.createElement('li');
            li.className = `item-row ${idx === currentIndex ? 'active' : ''}`;
            const typeBadge = item.isVideoTrack ? '📹' : '🎵';
            li.innerHTML = `
                <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width: 65%; cursor:pointer;">${idx + 1}. ${typeBadge} ${item.name}</span>
                <div style="display:flex; gap:6px; align-items:center;">
                    <span style="font-size:9px; color:#64748b;">${item.vttText ? '자막O' : '자막X'}</span>
                    <button class="btn-del-mini" data-idx="${idx}">삭제</button>
                </div>
            `;
            li.querySelector('span').addEventListener('click', () => {
                loadTrack(idx, true);
                modalBackdrop.classList.remove('show');
            });
            li.querySelector('.btn-del-mini').addEventListener('click', (ev) => {
                ev.stopPropagation();
                playlist.splice(idx, 1);
                if (currentIndex === idx) {
                    audio.pause(); video.pause();
                    currentIndex = -1;
                    trackTitle.innerText = '재생 중인 파일 없음';
                } else if (currentIndex > idx) {
                    currentIndex--;
                }
                renderPlaylist();
                saveToStorage();
            });
            ui.appendChild(li);
        });
    }

    function loadTrack(index, autoPlay = false) {
        if (index < 0 || index >= playlist.length) return;
        
        audio.pause();
        video.pause();

        currentIndex = index;
        renderPlaylist();

        const current = playlist[currentIndex];
        trackTitle.innerText = current.name;
        placeholder.style.display = 'none';
        artWrapper.classList.add('has-image');

        if (current.isVideoTrack) {
            video.style.display = 'block';
            image.style.display = 'none';
            video.muted = false;
            video.src = current.mediaSrc;
            video.load();
        } else {
            audio.src = current.mediaSrc;
            audio.load();

            if (backgroundMediaList.length > 0) {
                updateImageDisplay();
            } else {
                video.style.display = 'none';
                image.style.display = 'none';
                placeholder.style.display = 'block';
            }
        }

        suppressOverlaySub = false;

        if (current.vttText) {
            parseSubtitle(current.vttText, current.vttName);
        } else {
            subtitles = [];
            overlaySub.style.display = 'none';
            lyricsScrollView.innerHTML = '<div class="lyric-line">등록된 자막이 없습니다.</div>';
        }

        if (autoPlay) {
            const media = getActiveMedia();
            media.play().catch(e => console.log('Auto-play blocked:', e));
            btnPlay.innerText = '❚❚';
        }
    }

    function updateImageDisplay() {
        if (backgroundMediaList.length > 0) {
            const currentBg = backgroundMediaList[currentImageIndex];
            if (currentBg.type === 'video') {
                if (currentIndex < 0 || !playlist[currentIndex].isVideoTrack) {
                    video.style.display = 'block';
                    video.muted = true;
                    video.src = currentBg.url;
                    image.style.display = 'none';
                }
            } else {
                image.src = currentBg.url;
                image.style.display = 'block';
                if (currentIndex < 0 || !playlist[currentIndex].isVideoTrack) {
                    video.style.display = 'none';
                }
            }
            placeholder.style.display = 'none';
            artWrapper.classList.add('has-image');
        }
    }

    document.getElementById('btnPrevImg').addEventListener('click', () => {
        if (backgroundMediaList.length === 0) return;
        currentImageIndex = (currentImageIndex - 1 + backgroundMediaList.length) % backgroundMediaList.length;
        updateImageDisplay();
    });

    document.getElementById('btnNextImg').addEventListener('click', () => {
        if (backgroundMediaList.length === 0) return;
        currentImageIndex = (currentImageIndex + 1) % backgroundMediaList.length;
        updateImageDisplay();
    });

    function parseSubtitle(text, filename) {
        subtitles = [];
        const isSrt = filename.toLowerCase().endsWith('.srt');
        const lines = text.split(/\r?\n/);
        let cue = null;

        for (let i = 0; i < lines.length; i++) {
            const line = lines[i].trim();
            if (line.includes('-->')) {
                const times = line.split('-->');
                cue = { start: parseTime(times[0].trim()), end: parseTime(times[1].trim().split(' ')[0]), text: '' };
            } else if (cue && line !== '') {
                if (isSrt && !cue.text && /^\d+$/.test(line)) continue;
                if (cue.text) cue.text += '\n';
                cue.text += line;
            } else if (line === '' && cue) {
                subtitles.push(cue);
                cue = null;
            }
        }
        if (cue) subtitles.push(cue);

        renderLyricsScrollView();
    }

    function parseTime(t) {
        t = t.replace(',', '.');
        const p = t.split(':');
        let s = 0;
        if (p.length === 3) s += parseFloat(p[0]) * 3600 + parseFloat(p[1]) * 60 + parseFloat(p[2]);
        else if (p.length === 2) s += parseFloat(p[0]) * 60 + parseFloat(p[1]);
        return s;
    }

    function renderLyricsScrollView() {
        lyricsScrollView.innerHTML = '';
        subtitles.forEach((sub) => {
            const div = document.createElement('div');
            div.className = 'lyric-line';
            div.innerText = sub.text;
            div.addEventListener('click', () => {
                suppressOverlaySub = true;
                overlaySub.style.display = 'none';

                const media = getActiveMedia();
                media.currentTime = sub.start;
                if (currentIndex >= 0 && !playlist[currentIndex].isVideoTrack && backgroundMediaList[currentImageIndex]?.type === 'video') {
                    video.currentTime = sub.start;
                }

                if (media.paused) {
                    media.play();
                    btnPlay.innerText = '❚❚';
                }
            });
            lyricsScrollView.appendChild(div);
        });
    }

    btnPlay.addEventListener('click', () => {
        if (playlist.length === 0) return;
        const media = getActiveMedia();

        if (media.paused) {
            media.play();
            if (currentIndex >= 0 && !playlist[currentIndex].isVideoTrack && backgroundMediaList[currentImageIndex]?.type === 'video') video.play();
            btnPlay.innerText = '❚❚';
        } else {
            media.pause();
            if (currentIndex >= 0 && !playlist[currentIndex].isVideoTrack && backgroundMediaList[currentImageIndex]?.type === 'video') video.pause();
            btnPlay.innerText = '▶';
        }
    });

    document.getElementById('btnNextTrack').addEventListener('click', () => {
        if (playlist.length === 0) return;
        if (currentIndex + 1 < playlist.length) {
            loadTrack(currentIndex + 1, true);
        }
    });

    document.getElementById('btnPrevTrack').addEventListener('click', () => {
        if (playlist.length === 0) return;
        const media = getActiveMedia();
        if (media.currentTime > 3) {
            media.currentTime = 0;
            if (currentIndex >= 0 && !playlist[currentIndex].isVideoTrack && backgroundMediaList[currentImageIndex]?.type === 'video') video.currentTime = 0;
        } else if (currentIndex > 0) {
            loadTrack(currentIndex - 1, true);
        } else {
            media.currentTime = 0;
            if (currentIndex >= 0 && !playlist[currentIndex].isVideoTrack && backgroundMediaList[currentImageIndex]?.type === 'video') video.currentTime = 0;
        }
    });

    document.getElementById('btnRewind').addEventListener('click', () => {
        suppressOverlaySub = false;
        const media = getActiveMedia();
        media.currentTime = Math.max(0, media.currentTime - 5);
        if (currentIndex >= 0 && !playlist[currentIndex].isVideoTrack && backgroundMediaList[currentImageIndex]?.type === 'video') video.currentTime = media.currentTime;
    });

    document.getElementById('btnForward').addEventListener('click', () => {
        suppressOverlaySub = false;
        const media = getActiveMedia();
        media.currentTime = Math.min(media.duration || 0, media.currentTime + 5);
        if (currentIndex >= 0 && !playlist[currentIndex].isVideoTrack && backgroundMediaList[currentImageIndex]?.type === 'video') video.currentTime = media.currentTime;
    });

    function handleTimeUpdate(media) {
        const cur = media.currentTime;
        seekSlider.value = cur;
        currentTimeStr.innerText = formatTime(cur);
        durationStr.innerText = `-${formatTime(media.duration - cur)}`;

        if (currentIndex >= 0 && !playlist[currentIndex].isVideoTrack && backgroundMediaList[currentImageIndex]?.type === 'video') {
            if (Math.abs(cur - video.currentTime) > 0.3) {
                video.currentTime = cur;
            }
        }

        if (subtitles.length > 0) {
            const idx = subtitles.findIndex(s => cur >= s.start && cur <= s.end);
            
            if (idx !== -1) {
                if (!suppressOverlaySub) {
                    overlaySub.innerText = subtitles[idx].text;
                    overlaySub.style.display = 'block';
                }

                if (activeSubIndex !== idx) {
                    activeSubIndex = idx;
                    const lines = lyricsScrollView.querySelectorAll('.lyric-line');
                    lines.forEach((l, i) => l.classList.toggle('active', i === idx));
                    if (lines[idx]) {
                        lines[idx].scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }
            } else {
                overlaySub.style.display = 'none';
                suppressOverlaySub = false;
            }
        }
    }

    function handleMetadataLoaded(media) {
        seekSlider.max = media.duration || 100;
        durationStr.innerText = `-${formatTime(media.duration)}`;
    }

    function handleMediaEnded() {
        if (currentIndex + 1 < playlist.length) {
            loadTrack(currentIndex + 1, true);
        } else {
            btnPlay.innerText = '▶';
        }
    }

    audio.addEventListener('loadedmetadata', () => handleMetadataLoaded(audio));
    audio.addEventListener('timeupdate', () => {
        if (currentIndex >= 0 && !playlist[currentIndex].isVideoTrack) handleTimeUpdate(audio);
    });
    audio.addEventListener('ended', () => {
        if (currentIndex >= 0 && !playlist[currentIndex].isVideoTrack) handleMediaEnded();
    });

    video.addEventListener('loadedmetadata', () => {
        if (currentIndex >= 0 && playlist[currentIndex].isVideoTrack) handleMetadataLoaded(video);
    });
    video.addEventListener('timeupdate', () => {
        if (currentIndex >= 0 && playlist[currentIndex].isVideoTrack) handleTimeUpdate(video);
    });
    video.addEventListener('ended', () => {
        if (currentIndex >= 0 && playlist[currentIndex].isVideoTrack) handleMediaEnded();
    });

    seekSlider.addEventListener('input', () => {
        suppressOverlaySub = false;
        const media = getActiveMedia();
        media.currentTime = seekSlider.value;
        if (currentIndex >= 0 && !playlist[currentIndex].isVideoTrack && backgroundMediaList[currentImageIndex]?.type === 'video') {
            video.currentTime = seekSlider.value;
        }
    });

    document.getElementById('btnReset').addEventListener('click', () => {
        if (!confirm('저장된 데이터와 플레이리스트가 모두 초기화됩니다.')) return;
        localStorage.clear();
        window.location.reload();
    });

    // 앱 시작 시 저장소 로드
    loadFromStorage();
</script>

</body>
</html>
